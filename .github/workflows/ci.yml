name: CI

# The minimum content of a code repository (norm 5.1), the absence of secrets, and the same script a
# developer runs: scripts/test.sh builds the portal in a container with `npm ci` from the versioned lock
# file, type-checks it in strict mode, runs every test and builds the remote (Annex H, Annex I).

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The repository has its minimum content
        run: |
          for file in README.md .github/CODEOWNERS .gitignore .env.example package.json package-lock.json deploy/Dockerfile; do
            [ -f "$file" ] || { echo "missing $file"; exit 1; }
          done

      - name: No real environment file or key is versioned
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)keys/'; then
            echo "A real environment file or key is versioned"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install from the lock file, type-check, test, build
        run: bash scripts/test.sh
