# The catalog portal only. amaranta-shop-infra-postgres includes this file to compose the platform.
# The browser loads it through the shell (amaranta-shop-front), never directly.
name: amaranta-shop-catalog-portal

services:
  catalog-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: serve
    ports: ["4201:4201"]
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
