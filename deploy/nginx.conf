# Serves the catalog portal: a Module Federation REMOTE. It has no page of its own, so there is no fallback to index.html.

# The shell loads this portal from another origin, and a browser refuses a module script from another origin unless the
# server allows it. Only the shell may: an origin that is not listed gets an empty value, and an empty add_header sends nothing.
map $http_origin $shell_origin {
    default                     "";
    "http://localhost:4200"     $http_origin;    # the shell (amaranta-shop-front)
}

server {
    listen 4201;
    server_tokens off;    # the server does not say which nginx it is
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The probe of an orchestrator: it needs nothing from the application and is not logged.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Annex H, rule 4: remoteEntry.js (and the manifest) decide which version of this portal a browser loads, so they are
    # NEVER cached. A stale copy sends the shell to files that no longer exist.
    location ~ ^/(remoteEntry\.js|mf-manifest\.json)$ {
        include /etc/nginx/snippets/portal-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed by the build: a file never changes under its name, so it is cached for good. One that does not exist is a 404.
    location /assets/ {
        include /etc/nginx/snippets/portal-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Nothing else is served: this remote has no page, no route and no fallback.
    location / {
        return 404;
    }
}
